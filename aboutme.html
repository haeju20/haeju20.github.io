<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../2025-1di/css/aboutme.css">
  <title>sketch</title>
</head>
<body>
<div id="mySidenav" class="sidenav">
  <div class="main-menu-container">
    <div class="title-container">
      <div class="pin-icon" id="pin-icon"></div>
      <img src="../2025-1di/images/common/icon_menu-about.png" class="menu-title" id="title-aboutme" />
      <img src="../2025-1di/images/common/icon_menu-bookshelves.png" class="menu-title" id="title-bookshelves" />
      <img src="../2025-1di/images/common/icon_menu-contact.png" class="menu-title" id="title-contact" />
      <img src="../2025-1di/images/common/icon_menu-desk.png" class="menu-title" id="title-desk" />
      <img src="../2025-1di/images/common/icon_menu-works.png" class="menu-title" id="title-works" />
    </div>
  </div>
</div>

<div class="test-main-container">
  <div class="test-header">
    <div class="icon-wrapper">
      <img src="../2025-1di/images/common/icon_file-folder.png" class="menu-icon" />
      <img src="../2025-1di/images/common/icon_room-icon.png" class="room-icon"/>
    </div>
    <img src="../2025-1di/images/common/icon_menu-about.png" class="title-image"/>
  </div>

  <div class="test-bg-wrapper" id="test-bg-wrapper">
    <div class="two-cards-wrapper">
        <div class="character-wrapper">
          <div class="card-description" id="greeting-message">
            &lt; Hi &gt;
          </div>
          <div class="bg-grid-character">
            <div class="img-character-hi">
            </div>
          </div>
          <div class="empty-text">
            &lt;  &gt;
          </div>
        </div>

        <div class="card-wrapper">
          <div class="empty-text">
            &lt; Hi &gt;
          </div>
          <div class="bg-grid-card">
            <div class="info-container-top" id="info-container-name">
              Hello, I'm Jisu
            </div>
            <div class="info-container-top" id="info-container-study">
              I'm studying Design Informatics
            </div>
            <div class="info-container-bottom" id="info-container-explore">
              exploring new web design
            </div>
            <div class="info-container-bottom" id="info-container-love1">
              learning foreign languages,
            </div>
            <div class="info-container-bottom" id="info-container-love2">
              enjoying a cup of coffee,
            </div>
            <div class="info-container-bottom" id="info-container-love3">
              and taking a good nap!
            </div>
          </div>
          <div class="card-description" id="card-message">
            &lt; Contact Jisu &gt;
          </div>
        </div>

    </div>
  </div>

</div>

<script src="../2025-1di/js/aboutme.js"></script>
