<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../2025-1di/css/contact.css">
  <title>sketch</title>
</head>
<body>
<div id="mySidenav" class="sidenav">
  <div class="main-menu-container">
    <div class="title-container">
      <div class="pin-icon" id="pin-icon"></div>
      <img src="../2025-1di/images/common/icon_menu-about.png" class="menu-title" id="title-aboutme" />
      <img src="../2025-1di/images/common/icon_menu-bookshelves.png" class="menu-title" id="title-bookshelves" />
      <img src="../2025-1di/images/common/icon_menu-contact.png" class="menu-title" id="title-contact" />
      <img src="../2025-1di/images/common/icon_menu-desk.png" class="menu-title" id="title-desk" />
      <img src="../2025-1di/images/common/icon_menu-works.png" class="menu-title" id="title-works" />
    </div>
  </div>
</div>

<div class="test-main-container">
  <div class="test-header">
    <div class="icon-wrapper">
      <img src="../2025-1di/images/common/icon_file-folder.png" class="menu-icon" />
      <img src="../2025-1di/images/common/icon_room-icon.png" class="room-icon"/>
    </div>
    <img src="../2025-1di/images/common/icon_menu-contact.png" class="title-image"/>
  </div>

  <div class="test-bg-wrapper" id="test-bg-wrapper">
    <div class="two-cards-wrapper">
      <div class="character-wrapper">
        <div class="card-description" id="greeting-message">
          &lt; See you again ! &gt;
        </div>
        <div class="bg-grid-character">
          <div class="img-character-bye">
          </div>
        </div>
        <div class="empty-text">
          &lt;  &gt;
        </div>
      </div>

      <div class="card-wrapper">
        <div class="card-description" id="flip-message">
          &lt; Flip the card &gt;
        </div>
        <div class="bg-grid-card">
          <div class="bg-grid-card-inner">
            <div class="bg-grid-card-front">
              <div class="contact-container" id="contact-container-name">
                Name
              </div>
              <div class="input-container" id="input-container-name">
                <input type="text" id="contact-name" name="contact-name" placeholder="name">
              </div>
              <div class="contact-container" id="contact-container-email">
                Email
              </div>
              <div class="input-container" id="input-container-email">
                <input type="text" id="contact-email" name="contact-email" placeholder="email">
              </div>
              <div class="contact-container" id="contact-container-message">
                Message
              </div>
              <div class="input-container" id="input-container-message">
                <textarea placeholder="message"></textarea>
<!--                <input type="text" id="contact-message" name="contact-message" placeholder="message">-->
              </div>
            </div>

            <div class="bg-grid-card-back">
              <div class="contact-myContainer" id="contact-container-myName">
                Jisu Park
              </div>
              <div class="contact-myContainer" id="contact-container-myEmail">
                1712wltn@gmail.com
              </div>
              <div class="contact-myContainer" id="contact-container-mySite">
                haeju20.github.io
              </div>
            </div>
          </div>

        </div>
        <div class="card-description" id="submit-message">
          &lt; Submit &gt;
        </div>
      </div>
    </div>
  </div>

</div>

</body>
<script src="../2025-1di/js/contact.js"></script>
</html>
